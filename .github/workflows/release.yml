name: Release APK

# Push a tag like v1.0.1 -> builds the APK and publishes it as SoulForkTV.apk,
# always reachable at /releases/latest/download/SoulForkTV.apk (the link typed into Downloader).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > keystore/soulforktv.jks
      - name: Build
        run: |
          chmod +x gradlew
          VERSION_NAME="${GITHUB_REF_NAME#v}" VERSION_CODE="$((GITHUB_RUN_NUMBER + 1))" ./gradlew testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SoulForkTV.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: SoulForkTV.apk
